<svg width="1100" height="260" viewBox="0 0 1100 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="260" rx="22" fill="#F8FAFC"/>
  <text x="40" y="52" font-family="Segoe UI, Arial" font-size="26" font-weight="800" fill="#0F172A">Fluxo seguro de operacao</text>
  <text x="40" y="82" font-family="Segoe UI, Arial" font-size="15" fill="#475569">Antes de alteracoes sensiveis, o Assistente G-LAB cria uma trilha de recuperacao.</text>
  <g font-family="Segoe UI, Arial">
    <g transform="translate(40 124)">
      <rect width="190" height="84" rx="16" fill="#EFF6FF" stroke="#93C5FD"/>
      <text x="95" y="35" text-anchor="middle" font-size="15" font-weight="800" fill="#1E3A8A">1. Selecionar</text>
      <text x="95" y="58" text-anchor="middle" font-size="12" fill="#475569">Apps, ajustes ou AppX</text>
    </g>
    <path d="M250 166H302" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <path d="M294 158L304 166L294 174" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(322 124)">
      <rect width="190" height="84" rx="16" fill="#F0FDF4" stroke="#86EFAC"/>
      <text x="95" y="35" text-anchor="middle" font-size="15" font-weight="800" fill="#166534">2. Confirmar</text>
      <text x="95" y="58" text-anchor="middle" font-size="12" fill="#475569">Aviso antes do risco</text>
    </g>
    <path d="M532 166H584" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <path d="M576 158L586 166L576 174" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(604 124)">
      <rect width="190" height="84" rx="16" fill="#FFFBEB" stroke="#FCD34D"/>
      <text x="95" y="35" text-anchor="middle" font-size="15" font-weight="800" fill="#92400E">3. Backup</text>
      <text x="95" y="58" text-anchor="middle" font-size="12" fill="#475569">Registro, DNS e AppX</text>
    </g>
    <path d="M814 166H866" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <path d="M858 158L868 166L858 174" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(886 124)">
      <rect width="174" height="84" rx="16" fill="#FDF2F8" stroke="#F9A8D4"/>
      <text x="87" y="35" text-anchor="middle" font-size="15" font-weight="800" fill="#9D174D">4. Executar</text>
      <text x="87" y="58" text-anchor="middle" font-size="12" fill="#475569">Log visivel na tela</text>
    </g>
